<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horaires Grand Reims</title>
<!--__HEAD__-->
<script>if (navigator.standalone) document.documentElement.classList.add("standalone");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* DA Grand Reims Mobilités : orange du réseau en accent, police DM Sans (celle du site), couleurs des lignes comme décor.
   Mobile : plan plein écran, panneau qui glisse depuis le bas, onglets en bas. Bureau : panneau à gauche, plan à droite. */
:root {
  --bg: #eef0ef;
  --surface: #ffffff;
  --sunk: #f3f5f4;
  --ink: #15202b;
  --muted: #5a6670;
  --rule: #dde1df;
  --accent: #e8511c;
  --accent-ink: #ffffff;
  --accent-strong: #c4430f;
  --accent-strong-ink: #ffffff;
  --brand: #ff5500;
  --logo-ink: #1d1d1b;
  --alert: #e8511c;
  --map-case: #ffffff;
  --focus: #1a5fd0;
  --map-bg: #f2f2ef;
  --ok: #11834a;
  --theo: #8a959f;
  --late: #c05600;
  --me: #1a6dff;
  --font-display: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  --tab-h: 58px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317; --surface: #161d23; --sunk: #1b232a; --ink: #e7ebee; --muted: #94a0aa;
    --rule: #2a343c; --accent: #ff7a3d; --accent-ink: #1f0c00; --accent-strong: #ff7a3d; --accent-strong-ink: #1f0c00; --focus: #7aa7ff; --map-bg: #121417;
    --ok: #3ccf7f; --late: #ff9a3c; --theo: #7f8a94; --me: #5b9bff; --brand: #ff6a1a; --logo-ink: #f1f1ef; --alert: #ff7a3d; --map-case: #121417;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317; --surface: #161d23; --sunk: #1b232a; --ink: #e7ebee; --muted: #94a0aa;
  --rule: #2a343c; --accent: #ff7a3d; --accent-ink: #1f0c00; --accent-strong: #ff7a3d; --accent-strong-ink: #1f0c00; --focus: #7aa7ff; --map-bg: #121417;
  --ok: #3ccf7f; --late: #ff9a3c; --theo: #7f8a94; --me: #5b9bff; --brand: #ff6a1a; --logo-ink: #f1f1ef; --alert: #ff7a3d; --map-case: #121417;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
/* Appli installée (écran d'accueil iOS) : avec la barre d'état translucide, iOS retire la hauteur de la barre d'état
   à height:100% et laisse une bande vide en bas. 100vh y vaut bien tout l'écran. */
@media (display-mode: standalone) { html, body, #app { height: 100vh; } }
html.standalone, html.standalone body, html.standalone #app { height: 100vh; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font-body); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }

/* ---------- ossature ---------- */
#app { position: relative; height: 100%; display: grid; grid-template-columns: minmax(360px, 440px) 1fr; grid-template-rows: auto 1fr; grid-template-areas: "tabs map" "sheet map"; }
.mapwrap { grid-area: map; position: relative; min-height: 0; background: var(--map-bg); }
.sheet { grid-area: sheet; display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--rule); }
.tabbar { grid-area: tabs; display: flex; gap: 2px; padding: 8px 10px 0; background: var(--surface); border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.grab { display: none; }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px 8px; text-decoration: none; color: var(--muted); font: 600 12.5px/1 var(--font-display); letter-spacing: .02em; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabbar a[aria-current="page"] svg { color: var(--accent); }

@media (max-width: 899px) {
  #app { display: block; }
  header.top h1 { font-size: 17px; }
  header.top { padding: 0 16px 6px; }
  .mapwrap { position: absolute; inset: 0; }
  .tabbar { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; height: calc(var(--tab-h) + var(--sab)); padding: 4px 6px var(--sab); border: 0; border-top: 1px solid var(--rule); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .tabbar a { border-bottom: 0; justify-content: center; font-size: 11.5px; padding: 4px 2px; border-radius: 10px; }
  .tabbar a[aria-current="page"] { background: var(--sunk); }
  .sheet { position: absolute; z-index: 10; left: 0; right: 0; top: 55%; bottom: calc(var(--tab-h) + var(--sab)); border: 0; border-radius: 20px 20px 0 0; box-shadow: 0 -6px 30px rgb(0 0 0 / .16); transition: top .32s cubic-bezier(.2, .8, .2, 1); }
  .sheet.dragging { transition: none; }
  .grab { display: flex; justify-content: center; align-items: center; height: 22px; flex: none; touch-action: none; cursor: grab; }
  .grab span { width: 40px; height: 5px; border-radius: 3px; background: var(--rule); }
  header.top { padding-top: 0 !important; touch-action: none; }
  .maplegend { display: none !important; }
  .mapctl, .profbtn { top: calc(var(--sat) + 12px) !important; }
  /* #26 : appli lancée depuis l'écran d'accueil de l'iPhone : depuis iOS 26.1, la barre d'état (heure, batterie) a un fond
     opaque qui recouvrait le haut du plan. Le plan commence donc sous elle, et ce fond prend la couleur des panneaux. */
  html.standalone, html.standalone body { background: var(--surface); }
  html.standalone .mapwrap { top: var(--sat); }
  html.standalone .mapctl, html.standalone .profbtn { top: 12px !important; }
  input, select { font-size: 16px !important; } /* évite le zoom automatique d'iOS */
}

header.top { display: flex; align-items: center; gap: 10px; padding: 14px 18px 8px; flex: none; }
.mark { width: 40px; height: 24px; color: var(--brand); display: grid; place-items: center; flex: none; }
.mark svg { width: 100%; height: 100%; }
header.top h1 { font-size: 19px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.rt { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 10px 4px 8px; background: var(--sunk); white-space: nowrap; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
.rt i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.rt.ok i { background: var(--ok); animation: pulse 2s infinite; }
.rt.ok { color: var(--ink); }
.rt.err i { background: var(--theo); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

.scroll { overflow: auto; min-height: 0; flex: 1; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.view { display: none; padding: 6px 16px 28px; }
.view.on { display: flex; flex-direction: column; gap: 14px; }
footer.src { padding: 14px 2px 4px; font-size: 11.5px; color: var(--muted); }
footer.src a { color: inherit; }

/* ---------- éléments communs ---------- */
.lbl { font: 600 12px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-h h2 { font-size: 18px; font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label { font: 600 12px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.inp { width: 100%; height: 46px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--sunk); }
.inp:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); background: var(--surface); }
.row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.row > .field { flex: 1 1 120px; min-width: 0; }
/* iPhone : les champs date et heure ont une largeur minimale imposée par Safari, qui les faisait déborder et se chevaucher */
.inp[type="date"], .inp[type="time"] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; line-height: 44px; text-align: left; }
.inp::-webkit-date-and-time-value { text-align: left; margin: 0; }
.btn { height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.small { height: 36px; padding: 0 12px; font-size: 14px; }
.btn.ghost { border-color: transparent; background: var(--sunk); }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surface); display: grid; place-items: center; flex: none; }
.star svg { width: 22px; height: 22px; }
.star[aria-pressed="true"] { color: #e0a100; border-color: color-mix(in srgb, #e0a100 50%, var(--rule)); background: color-mix(in srgb, #e0a100 10%, var(--surface)); }
.star[aria-pressed="true"] svg path { fill: currentColor; }
.note { font-size: 13.5px; color: var(--muted); padding: 10px 12px; border-radius: 10px; background: var(--sunk); border-left: 3px solid var(--rule); }
.note.warn { border-left-color: var(--theo); }
.empty { color: var(--muted); padding: 14px 4px; text-align: center; font-size: 14px; }
.card { border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); overflow: hidden; }

/* quand ? (date et heure repliables) */
details.when { border: 1px solid var(--rule); border-radius: 10px; background: var(--sunk); }
details.when > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 44px; cursor: pointer; font-weight: 500; }
details.when > summary::-webkit-details-marker { display: none; }
details.when > summary .chev { margin-left: auto; color: var(--muted); transition: transform .2s; }
details.when[open] > summary .chev { transform: rotate(180deg); }
details.when .whenbody { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 10px; }

/* sélecteur d'arrêt */
.picker { position: relative; flex: 1; }
.picker .dot { position: absolute; left: 13px; top: 50%; width: 11px; height: 11px; border-radius: 50%; transform: translateY(-50%); border: 2.5px solid var(--ink); background: var(--surface); pointer-events: none; }
.picker.to .dot { background: var(--ink); border-radius: 3px; }
.picker .inp { padding-left: 34px; }
.sugg { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 12px 34px rgb(0 0 0 / .18); max-height: min(340px, 50vh); overflow: auto; display: none; padding: 4px; }
.sugg.on { display: block; }
.sugg .sg-h { padding: 8px 10px 4px; }
.sugg button { display: flex; width: 100%; gap: 8px; align-items: center; justify-content: space-between; min-height: 44px; padding: 6px 10px; border: 0; background: none; text-align: left; border-radius: 8px; }
.sugg button[aria-selected="true"], .sugg button:hover { background: var(--sunk); }
.sugg .nm { display: flex; flex-direction: column; }
.sugg .nm small { color: var(--muted); font-size: 12px; }
.sugg button.plc { flex-direction: row; justify-content: flex-start; align-items: center; text-align: left; gap: 10px; }
.sugg button.plc .nm { align-items: flex-start; }
.sugg .pic { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); color: var(--ink); }
.sugg button.plc:first-child .pic { background: color-mix(in srgb, var(--me) 14%, var(--surface)); color: var(--me); }
.sugg .sg-wait { padding: 10px 12px; color: var(--muted); font-size: 13px; }
.picker .inp.isplace { font-weight: 600; }
.ptpop { display: flex; gap: 10px; align-items: center; padding-right: 22px; margin-bottom: 8px; }
.ptpop h3 { margin: 0; padding: 0; } .ptpop .sub { margin: 0; }
.ptpop .pic { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--me) 14%, var(--surface)); color: var(--me); }
.badges { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; max-width: 55%; }

.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 10px; padding: 3px; background: var(--sunk); }
.seg button { border: 0; background: none; padding: 8px 12px; border-radius: 7px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .14); }

/* badges de ligne */
.bd { position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 22px; padding: 0 6px; border-radius: 5px; font: 700 13.5px/1 var(--font-display); letter-spacing: .02em; flex: none; }
.bd.tram { border-radius: 11px; min-width: 46px; }
.bd.sm { min-width: 24px; height: 18px; font-size: 11.5px; padding: 0 4px; border-radius: 4px; }
.bd.sm.tram { min-width: 36px; border-radius: 9px; }
.bd.lg { height: 30px; min-width: 40px; font-size: 16px; border-radius: 7px; }
.bd.lg.tram { min-width: 60px; border-radius: 15px; }

/* points temps réel / théorique */
.dotlive, .dottheo { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dotlive { background: var(--ok); }
.dottheo { background: var(--theo); }
.legend-dots { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend-dots span { display: inline-flex; align-items: center; gap: 5px; }

/* départs compacts (accueil) */
.stopcard { display: flex; flex-direction: column; }
.stopcard .sc-h { display: flex; align-items: center; gap: 10px; padding: 12px 12px 8px 14px; }
.stopcard .sc-h .nm { flex: 1; min-width: 0; }
.stopcard .sc-h b { font: 700 17px/1.15 var(--font-display); display: block; }
.stopcard .sc-h small { color: var(--muted); font-size: 12.5px; }
.stopcard .sc-h .go { border: 0; background: none; color: var(--muted); padding: 8px; }
.mini { display: flex; flex-direction: column; }
.mini button { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 14px; border: 0; border-top: 1px solid var(--rule); background: none; text-align: left; min-height: 48px; }
.mini button:hover { background: var(--sunk); }
.mini .dir { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.mini .tw { display: flex; gap: 10px; align-items: baseline; }
.mini .t1 { display: inline-flex; align-items: center; gap: 5px; font: 700 17px/1 var(--font-display); }
.mini .t2 { font: 600 13.5px/1 var(--font-display); color: var(--muted); }
.mini .none { padding: 10px 14px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 13.5px; }
/* fin de service : ligne terminée à un arrêt */
.mini .endrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--rule); min-height: 48px; }
.endt { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; }
.endt b { font: 700 13.5px/1.15 var(--font-display); color: var(--muted); }
.endt small { font-size: 12px; color: var(--muted); }
.endt.big { grid-column: 1 / -1; align-items: flex-start; text-align: left; }
.endt.big b { font-size: 15px; }
.dep.ended .dir { color: var(--muted); }

.tripcard { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 14px; border: 0; background: none; text-align: left; width: 100%; }
.tripcard .od { font: 700 16.5px/1.2 var(--font-display); }
.tripcard .od span { color: var(--muted); font-weight: 500; margin: 0 4px; }
.tripcard .sub { color: var(--muted); font-size: 13.5px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.tripcard .big { grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: right; font: 700 20px/1 var(--font-display); display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.tripcard .big small { font: 500 12px/1 var(--font-body); color: var(--muted); }
.tripcard + .tripcard { border-top: 1px solid var(--rule); }

.hero { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r); background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 9%, var(--surface)), var(--surface)); border: 1px solid var(--rule); }
.hero p { margin: 0; color: var(--muted); font-size: 14px; }

/* résultats d'itinéraire */
.od { display: grid; grid-template-columns: 1fr 44px; gap: 8px; align-items: center; }
.od .stack { display: flex; flex-direction: column; gap: 8px; }
.results { display: flex; flex-direction: column; gap: 10px; }
.itmore { align-self: center; margin: 2px auto; }
.jc { border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.jc.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.jc > button.head { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; width: 100%; text-align: left; padding: 12px 14px; border: 0; background: none; }
.jc .times { font: 700 22px/1.1 var(--font-display); letter-spacing: .01em; }
.jc .times .arrow { color: var(--muted); font-weight: 500; margin: 0 4px; }
.jc .dur { font: 600 16px/1.1 var(--font-display); text-align: right; }
.jc .chain { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.jc .meta { text-align: right; color: var(--muted); font-size: 13px; }
.jc .next { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-size: 14px; }
.jc .next b { font: 700 16px/1 var(--font-display); }
.tag { font: 600 11.5px/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em; padding: 4px 6px; border-radius: 4px; background: var(--sunk); color: var(--muted); }
.tag.hot { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.walkico { display: inline-flex; align-items: center; gap: 2px; }
.sep { width: 10px; height: 1px; background: var(--rule); }
.tl { padding: 4px 14px 14px; display: none; }
.jc.sel .tl { display: block; }
.st { display: grid; grid-template-columns: 50px 22px 1fr; column-gap: 8px; }
.st .t { font: 600 15px/1.2 var(--font-display); text-align: right; padding-top: 1px; }
.st .rail { position: relative; display: flex; justify-content: center; }
.st .rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 5px; background: var(--c, var(--rule)); border-radius: 3px; }
.st.walk .rail::before { width: 0; border-left: 3px dotted var(--muted); background: none; }
.st .node { position: relative; z-index: 1; width: 13px; height: 13px; border-radius: 50%; background: var(--surface); border: 3px solid var(--c, var(--ink)); margin-top: 3px; }
.st .body { padding-bottom: 12px; min-width: 0; }
.st .name { font-weight: 600; }
.st .sub { color: var(--muted); font-size: 13.5px; }
.st.cap .rail::before { top: 9px; }
.st.end .rail::before { bottom: auto; height: 9px; }
.wait { display: inline-flex; align-items: center; gap: 6px; }
.wait small { font: 500 12px/1 var(--font-body); color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 6px 0; color: var(--focus); font-size: 13.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
details.inter summary { cursor: pointer; color: var(--muted); font-size: 13.5px; list-style: none; padding: 2px 0; }
details.inter summary::-webkit-details-marker { display: none; }
details.inter summary::before { content: "▸ "; }
details.inter[open] summary::before { content: "▾ "; }
details.inter ol { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13.5px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
details.inter li { display: contents; }
details.inter li span:first-child { color: var(--muted); }

/* passages */
.deps { display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.dep { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; padding: 12px; border-top: 1px solid var(--rule); align-items: center; background: var(--surface); }
.dep:first-child { border-top: 0; }
.dep .dir { font-weight: 600; min-width: 0; }
.dep .dir small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.dep .tt { grid-column: 1 / -1; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }

// ---------- #30 : tram remplacé par des bus (SUB) ----------
const pinSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>`;

  // chaque sens de la SUB peut s'arrêter de l'autre côté de la rue (autre arrêt) : on prend, pour chaque direction, l'arrêt le plus proche
  const P0 = net.P[par], near = SUBP.map((sp) => ({ i: sp, d: sp === par ? 0 : distM(P0[1], P0[2], net.P[sp][1], net.P[sp][2]) })).filter((x) => x.d <= nb.d + 250).sort((a, b) => a.d - b.d);

function linePats(ri, dir) { return net.pats.map((p, i) => [p, i]).filter(([p]) => p.r === ri && p.dir === dir); }

// ---------- Mon bus : suivi d'une course, arrêt de descente, alertes ----------
// minutes d'avance appliquées aux courses en temps réel (le flux a un peu de retard sur la réalité).

  // état d'une course à l'instant : arrêt atteint, position, horaires

// prochains départs des autres lignes à un arrêt, après l'heure t (une ligne + direction par groupe)
const connCache = new Map();
function connsAt(par, t, exclR, max = 6) {
  const key = par + ":" + Math.floor(t) + ":" + exclR + ":" + (net.liveDay) + ":" + Math.floor(Date.now() / 30000);
  if (connCache.has(key)) return connCache.get(key);
  const day = todayIdx(); let out = [];
  if (day >= 0 && day < net.nd) {
    const g = new Map();
    for (const x of departures(net, par, day, Math.floor(t), 75)) {
      const p = net.pats[x.pat]; if (p.r === exclR || x.t < t || x.na) continue;
      const k = p.r + "|" + p.h; if (!g.has(k)) g.set(k, { r: p.r, h: p.h, list: [] });
      const G = g.get(k); if (G.list.length < 2) G.list.push(x);
    }
    out = [...g.values()].sort((a, b) => a.list[0].t - b.list[0].t).slice(0, max);
  }
  if (connCache.size > 200) connCache.clear();
  connCache.set(key, out); return out;
}
// #10 : correspondances avec leur direction (pastilles compactes, 6 au plus)
function connsDir(par, t, exclR) {
  const cs = connsAt(par, t, exclR, 40);
  return cs.flatMap((G) => G.list.map((x) => ({ r: G.r, h: G.h, x }))).sort((a, b) => a.x.t - b.x.t).slice(0, 6);
}

const RT_URL = "https://proxy.transport.data.gouv.fr/resource/fluo-citura-reims-gtfs-rt";
const rtEl = $("#rt"); const RT = { at: 0, ok: false, n: 0, err: "" };
function parisMidnightEpoch(k) {
  const iso = net.isoOf(k), noon = Date.parse(iso + "T12:00:00Z");
  const h = +new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Paris", hour: "2-digit", hourCycle: "h23" }).format(new Date(noon));
  return noon / 1000 - (h - 12) * 3600 - 12 * 3600;
}
function rtLabel() {
  if (RT.ok) { const s = Math.round((Date.now() - RT.at) / 1000); rtEl.className = "rt ok"; rtEl.lastChild.textContent = s < 90 ? "En direct" : `Direct · il y a ${Math.round(s / 60)} min`; }
  else if (RT.err) { rtEl.className = "rt err"; rtEl.lastChild.textContent = "Théorique"; }
}
rtEl.addEventListener("click", () => { toast(RT.ok ? `${RT.n} courses suivies en temps réel. Actualisation toutes les 30 s.` : RT.err, 5000); pollRT(); });
let rtTimer = 0;
async function pollRT() {
  clearTimeout(rtTimer);
  if (SIMU) { RT.ok = false; RT.err = "Simulation d'heure : temps réel coupé."; rtLabel(); return; }
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch(RT_URL, { cache: "no-store", signal: ctl.signal }); clearTimeout(to);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const feed = decodeFeed(new Uint8Array(await r.arrayBuffer()));
    const today = todayIdx();
    if (today < 0 || today >= net.nd) throw new Error("date hors du fichier d'horaires");
    const st = applyRT(net, feed, today, parisMidnightEpoch);
    RT.ok = true; RT.at = Date.now(); RT.n = st.matched; RT.err = "";
    rtEl.title = `${st.matched} courses suivies en temps réel sur ${st.total} annoncées.`;
    rerender();
  } catch (e) {
    RT.ok = false;
    RT.err = /claude/.test(location.hostname) ? "Le temps réel ne peut pas être chargé dans cette page hébergée sur claude.ai. Utilisez la version GitHub." : "Flux temps réel injoignable pour le moment (" + (e.message || e) + "). Nouvel essai dans 30 s.";
    rtEl.title = RT.err;
    // un échec ponctuel ne fait plus repasser en théorique (le bus sautait puis revenait) : on garde le dernier flux 3 min
    if (net.liveDay >= 0 && !(RT.at && Date.now() - RT.at < 180000)) { net.pats.forEach((p) => { p.LA = p.LD = p.live = null; }); net.liveDay = -1; rerender(); }
  }
  rtLabel();
  rtTimer = setTimeout(pollRT, 30000);
}

const UPD = UPD_LOG[0].v;

// volets à faire défiler (présentation des mises à jour #23, installation de l'appli #22)
function updPop(slides = UPD_LOG[0].slides, o = {}) {
  let el = $("#updpop");
  if (!el) { el = document.createElement("div"); el.id = "updpop"; document.body.appendChild(el); }
  const n = slides.length, UPD_SLIDES = slides;
  el.innerHTML = `<div class="up-in" tabindex="-1" role="dialog" aria-modal="true" aria-label="${esc(o.label || "Nouveautés de la mise à jour")}">
    <div class="up-top"><span>${esc(o.kicker || "Mise à jour")}</span><button type="button" class="up-skip">${n > 1 ? "Passer" : "Fermer"}</button></div>
    <div class="up-track">${UPD_SLIDES.map((x) => `<section class="up-sl">${x.img ? `<span class="up-img">${x.img}</span>` : `<span class="up-ico">${x.ico}</span>`}<h2>${x.t}</h2>${x.b}</section>`).join("")}</div>
    <div class="up-dots"${n > 1 ? "" : " hidden"}>${UPD_SLIDES.map((x, i) => `<i${i ? "" : ' class="on"'}></i>`).join("")}</div>
    <button type="button" class="up-go">Suivant</button>
  </div>`;
  const tr = $(".up-track", el), go = $(".up-go", el), dots = [...el.querySelectorAll(".up-dots i")];
  const cur = () => Math.round(tr.scrollLeft / (tr.clientWidth || 1));
  const sync = () => { const k = cur(); dots.forEach((d, i) => d.classList.toggle("on", i === k)); go.textContent = k >= n - 1 ? (o.last || "C'est parti !") : "Suivant"; };
  tr.addEventListener("scroll", sync, { passive: true });
  const close = () => { el.classList.remove("on"); document.removeEventListener("keydown", esc_); if (o.onClose) o.onClose(); else setTimeout(checkNight, 300); };
  const esc_ = (e) => { if (e.key === "Escape") close(); };
  go.onclick = () => { const k = cur(); if (k >= n - 1) close(); else tr.scrollTo({ left: (k + 1) * tr.clientWidth, behavior: reduceMotion ? "auto" : "smooth" }); };
  $(".up-skip", el).onclick = close;
  document.addEventListener("keydown", esc_);
  sync();
  el.classList.add("on");
  setTimeout(() => { try { $(".up-in", el).focus(); } catch (e) {} }, 50);
}
function checkUpd() {

  const busy = () => $("#splash") || $("#nightpop.on");
  const wait = () => { if (busy()) return setTimeout(wait, 500); store.set("updSeen", UPD); if (first) welcomePop(); else updPop(); };

// ---------- animation de démarrage ----------
// Inspirée du film de lancement du logo : deux disques se rejoignent, deviennent un trait qui parcourt
// deux fois la boucle de l'infini, puis le symbole apparaît avec ses bandes et le nom du réseau glisse à côté.
function runSplash() {
  const el = $("#splash"); if (!el) return;
  let seen = false;
  try { seen = sessionStorage.getItem("grm:splash") === "1"; sessionStorage.setItem("grm:splash", "1"); } catch (e) {}
  if (seen) { el.remove(); return; }
  const INF = "M83.8 50A33.8 33.8 0 1 0 151.4 50A33.8 33.8 0 1 0 83.8 50A33.8 33.8 0 1 1 16.2 50A33.8 33.8 0 1 1 83.8 50";
  const bars = [[-40, 4, 190], [120, 18, 260], [-90, 36, 150], [260, 58, 220], [10, 76, 240], [200, 92, 170]];
  el.innerHTML = `<svg viewBox="0 0 551 100" aria-hidden="true">
    <g id="sp-bars" fill="var(--brand)" opacity="0">${bars.map(([x, y, w]) => `<rect x="${x}" y="${y}" width="${w}" height="7" rx="3.5"/>`).join("")}</g>
    <g id="sp-all">
      <circle id="sp-c1" cx="50" cy="50" r="0" fill="var(--brand)"/><circle id="sp-c2" cx="117.6" cy="50" r="0" fill="var(--brand)"/>
      <path id="sp-inf" d="${INF + INF.replace(/^M83.8 50/, "")}" fill="none" stroke="var(--brand)" stroke-width="12" stroke-linecap="round" opacity="0"/>
      <g id="sp-sym" fill="var(--brand)" opacity="0">${symInner("spl")}</g>
    </g>
    <g id="sp-wm" opacity="0"><path fill="var(--logo-ink)" d="${WM_DARK}"/><path fill="var(--brand)" d="${WM_ORANGE}"/></g>
  </svg>`;
  const g = (id) => el.querySelector("#" + id);
  const all = g("sp-all"), c1 = g("sp-c1"), c2 = g("sp-c2"), inf = g("sp-inf"), sym = g("sp-sym"), wm = g("sp-wm"), br = g("sp-bars");
  const L2 = inf.getTotalLength(), L = L2 / 2;
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const eo = (x) => 1 - Math.pow(1 - x, 3), eio = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const back = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const CX = 275.5 - 83.8; // symbole centré, puis décalé pour laisser la place au nom
  let done = false, t0 = 0;
  const finish = () => { if (done) return; done = true; el.classList.add("out"); setTimeout(() => el.remove(), 450); };
  el.addEventListener("click", finish);
  setTimeout(finish, 4200);
  const set = (n, k, v) => n.setAttribute(k, v);
  if (reduceMotion) {
    set(sym, "opacity", 1); set(wm, "opacity", 1);
    setTimeout(finish, 900); return;
  }
  const END = 2500;
  const frame = (now) => {
    if (done) return;
    if (!t0) t0 = now;
    const t = now - t0;
    // 1. deux disques apparaissent de part et d'autre puis se rejoignent
    const a = back(seg(t, 0, 320)), m = eio(seg(t, 300, 640)), sh = eo(seg(t, 620, 760));
    const r = 50 * a * (1 - sh * 0.88);
    set(c1, "r", Math.max(0, r)); set(c2, "r", Math.max(0, r));
    set(c1, "cx", 50 - 110 * (1 - m) + 33.8 * m); set(c2, "cx", 117.6 + 110 * (1 - m) - 33.8 * m);
    const discs = t < 780 ? 1 : 0; set(c1, "opacity", discs); set(c2, "opacity", discs);
    // bandes de fond qui filent pendant la rencontre
    const bt = seg(t, 250, 1100);
    set(br, "opacity", (0.14 * Math.sin(Math.PI * bt)).toFixed(3));
    set(br, "transform", `translate(${(-160 + 320 * eio(bt)).toFixed(1)} 0)`);
    // 2. le trait parcourt deux fois la boucle de l'infini
    const p = eio(seg(t, 740, 1700));
    const head = p * L2, len = Math.min(head, L * (0.12 + 0.88 * p));
    set(inf, "opacity", t < 740 ? 0 : t < 1950 ? 1 : 1 - seg(t, 1950, 2100));
    set(inf, "stroke-dasharray", `${Math.max(0.01, len).toFixed(2)} ${L2 * 2}`);
    set(inf, "stroke-dashoffset", (-(head - len)).toFixed(2));
    // 3. le trait s'épaissit en deux anneaux, le symbole et ses bandes apparaissent
    set(inf, "stroke-width", (12 + 21.6 * eo(seg(t, 1650, 1900))).toFixed(2));
    set(sym, "opacity", eo(seg(t, 1850, 2050)).toFixed(3));
    // 4. le symbole se décale, le nom du réseau glisse à côté
    const sl = eio(seg(t, 2050, 2400));
    set(all, "transform", `translate(${(CX * (1 - sl)).toFixed(2)} 0)`);
    set(wm, "opacity", sl.toFixed(3)); set(wm, "transform", `translate(${(40 * (1 - sl)).toFixed(2)} 0)`);
    if (t >= END + 350) { finish(); return; }
    requestAnimationFrame(frame);
  };
  set(all, "transform", `translate(${CX} 0)`);
  requestAnimationFrame(frame);
}
