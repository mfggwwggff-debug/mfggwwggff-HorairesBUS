<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horaires Grand Reims</title>
<!--__HEAD__-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan : signalétique de réseau. Encre bleu nuit, rouge tram en accent rare, couleurs des lignes comme seul vrai décor.
   Mise en page : panneau de recherche à gauche, plan du réseau à droite (empilés sur mobile). */
:root {
  --bg: #eef0ef;
  --surface: #ffffff;
  --sunk: #f5f6f5;
  --ink: #15202b;
  --muted: #5a6670;
  --rule: #d8dcda;
  --accent: #c8001a;
  --accent-ink: #ffffff;
  --focus: #1a5fd0;
  --map-bg: #e6e9e7;
  --ok: #11834a;
  --theo: #e07b00;
  --late: #c05600;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317; --surface: #161d23; --sunk: #11171c; --ink: #e7ebee; --muted: #94a0aa;
    --rule: #28323a; --accent: #ff5468; --accent-ink: #1a0005; --focus: #7aa7ff; --map-bg: #10161b; --ok: #3ccf7f; --late: #ff9a3c; --theo: #ffa035;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317; --surface: #161d23; --sunk: #11171c; --ink: #e7ebee; --muted: #94a0aa;
  --rule: #28323a; --accent: #ff5468; --accent-ink: #1a0005; --focus: #7aa7ff; --map-bg: #10161b; --ok: #3ccf7f; --late: #ff9a3c; --theo: #ffa035;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font-body); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }

.app { display: grid; grid-template-columns: minmax(340px, 460px) 1fr; height: 100%; }
.panel { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--rule); }
.mapwrap { position: relative; min-height: 0; background: var(--map-bg); }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 380px; height: auto; }
  .panel { border-right: 0; border-bottom: 1px solid var(--rule); }
}

header.top { display: flex; align-items: center; gap: 12px; padding: 14px 18px 10px; }
.mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 15px/1 var(--font-display); letter-spacing: .02em; flex: none; }
header.top h1 { font-size: 21px; font-weight: 700; letter-spacing: .01em; }
header.top .valid { margin-left: auto; font-size: 12.5px; color: var(--muted); text-align: right; line-height: 1.25; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }

nav.tabs { display: flex; gap: 4px; padding: 0 14px; border-bottom: 1px solid var(--rule); }
nav.tabs a { padding: 10px 10px 9px; text-decoration: none; color: var(--muted); font: 600 15.5px/1 var(--font-display); border-bottom: 3px solid transparent; margin-bottom: -1px; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs a:hover { color: var(--ink); }

.scroll { overflow: auto; min-height: 0; flex: 1; }
.view { display: none; padding: 16px 18px 28px; }
.view.on { display: flex; flex-direction: column; gap: 14px; }

/* champs */
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label, .lbl { font: 600 12px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.inp { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sunk); }
.inp:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.row > .field { flex: 1 1 120px; }
.od { display: grid; grid-template-columns: 1fr 40px; gap: 8px 8px; align-items: center; }
.od .stack { display: flex; flex-direction: column; gap: 8px; }
.swap { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.swap:hover { border-color: var(--ink); }
.picker { position: relative; }
.picker .dot { position: absolute; left: 12px; top: 50%; width: 10px; height: 10px; border-radius: 50%; transform: translateY(-50%); border: 2.5px solid var(--ink); background: var(--surface); }
.picker.to .dot { background: var(--ink); border-radius: 2px; }
.picker .inp { padding-left: 32px; }
.sugg { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 10px 30px rgb(0 0 0 / .14); max-height: 300px; overflow: auto; display: none; padding: 4px; }
.sugg.on { display: block; }
.sugg button { display: flex; width: 100%; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 10px; border: 0; background: none; text-align: left; border-radius: 6px; cursor: pointer; }
.sugg button[aria-selected="true"], .sugg button:hover { background: var(--sunk); }
.sugg .badges { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; max-width: 55%; }

.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; padding: 2px; background: var(--sunk); }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.btn { height: 42px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.small { height: 32px; padding: 0 10px; font-size: 13.5px; }

.note { font-size: 13.5px; color: var(--muted); padding: 10px 12px; border-radius: 8px; background: var(--sunk); border-left: 3px solid var(--rule); }
.note.warn { border-left-color: #d98a00; }

/* badges de ligne */
.bd { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 22px; padding: 0 6px; border-radius: 5px; font: 700 13.5px/1 var(--font-display); letter-spacing: .02em; flex: none; }
.bd.tram { border-radius: 11px; min-width: 46px; }
.bd.sm { min-width: 24px; height: 18px; font-size: 11.5px; padding: 0 4px; border-radius: 4px; }
.bd.sm.tram { min-width: 36px; border-radius: 9px; }

/* résultats */
.results { display: flex; flex-direction: column; gap: 10px; }
.jc { border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.jc.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.jc > button.head { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; width: 100%; text-align: left; padding: 12px 14px; border: 0; background: none; cursor: pointer; }
.jc .times { font: 700 22px/1.1 var(--font-display); letter-spacing: .01em; }
.jc .times .arrow { color: var(--muted); font-weight: 500; margin: 0 4px; }
.jc .dur { font: 600 16px/1.1 var(--font-display); text-align: right; }
.jc .chain { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.jc .meta { text-align: right; color: var(--muted); font-size: 13px; }
.tag { font: 600 11.5px/1 var(--font-display); text-transform: uppercase; letter-spacing: .06em; padding: 4px 6px; border-radius: 4px; background: var(--sunk); color: var(--muted); }
.tag.hot { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.walkico { display: inline-flex; align-items: center; gap: 2px; }
.sep { width: 10px; height: 1px; background: var(--rule); }

/* fil détaillé */
.tl { padding: 4px 14px 14px; display: none; }
.jc.sel .tl { display: block; }
.st { display: grid; grid-template-columns: 50px 22px 1fr; column-gap: 8px; }
.st .t { font: 600 15px/1.2 var(--font-display); text-align: right; padding-top: 1px; }
.st .rail { position: relative; display: flex; justify-content: center; }
.st .rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 5px; background: var(--c, var(--rule)); border-radius: 3px; }
.st.walk .rail::before { width: 0; border-left: 3px dotted var(--muted); background: none; }
.st .node { position: relative; z-index: 1; width: 13px; height: 13px; border-radius: 50%; background: var(--surface); border: 3px solid var(--c, var(--ink)); margin-top: 3px; }
.st .body { padding-bottom: 12px; min-width: 0; }
.st .name { font-weight: 600; }
.st .sub { color: var(--muted); font-size: 13.5px; }
.st.cap .rail::before { top: 9px; }
.st.end .rail::before { bottom: auto; height: 9px; }
.st.mid .rail::before { }
details.inter summary { cursor: pointer; color: var(--muted); font-size: 13.5px; list-style: none; }
details.inter summary::-webkit-details-marker { display: none; }
details.inter summary::before { content: "▸ "; }
details.inter[open] summary::before { content: "▾ "; }
details.inter ol { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13.5px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
details.inter li { display: contents; }
details.inter li span:first-child { color: var(--muted); }

/* passages */
.deps { display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.dep { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; padding: 11px 12px; border-top: 1px solid var(--rule); align-items: center; background: var(--surface); }
.dep:first-child { border-top: 0; }
.dep .dir { font-weight: 600; min-width: 0; }
.dep .dir small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.dep .tt { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 600 14.5px/1 var(--font-display); padding: 6px 8px; border-radius: 6px; background: var(--sunk); border: 1px solid var(--rule); }
.chip.soon { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip.prev { opacity: .75; font-style: italic; }
.dep .open { grid-column: 2; justify-self: start; border: 0; background: none; padding: 0; color: var(--focus); cursor: pointer; font-size: 13px; }

/* lignes */
.lgrid { display: flex; flex-wrap: wrap; gap: 6px; }
.lgrid button { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 6px; }
.lgrid button .bd { height: 30px; min-width: 40px; font-size: 15.5px; }
.lgrid button .bd.tram { min-width: 60px; border-radius: 15px; }
.lgrid button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.lgroup { display: flex; flex-direction: column; gap: 6px; }
.lhead { display: flex; gap: 10px; align-items: center; }
.lhead h2 { font-size: 20px; font-weight: 600; }
.ttwrap { overflow: auto; max-height: 60vh; border: 1px solid var(--rule); border-radius: var(--r); background: var(--surface); }
@media (max-width: 860px) { .ttwrap { max-height: none; } }
table.tt { border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
table.tt th, table.tt td { padding: 5px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.tt thead th { position: sticky; top: 0; background: var(--sunk); z-index: 2; font: 600 12px/1.1 var(--font-display); color: var(--muted); text-align: center; }
table.tt tbody th { position: sticky; left: 0; background: var(--surface); z-index: 1; text-align: left; font-weight: 500; max-width: 170px; overflow: hidden; text-overflow: ellipsis; border-right: 1px solid var(--rule); }
table.tt thead th:first-child { left: 0; z-index: 3; text-align: left; }
table.tt td { text-align: center; font: 500 14px/1 var(--font-display); }
table.tt td.no { color: var(--rule); }
table.tt tr:hover td, table.tt tr:hover th { background: color-mix(in srgb, var(--focus) 7%, var(--surface)); }
table.tt td.past { color: var(--muted); }

/* carte */
canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas#map.drag { cursor: grabbing; }
.mapctl { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
.mapctl button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font-size: 18px; line-height: 1; box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
.maplegend { position: absolute; left: 12px; bottom: 12px; pointer-events: none; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 6px 8px; border-radius: 6px; max-width: calc(100% - 24px); }
.pop { position: absolute; z-index: 5; min-width: 200px; max-width: 260px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .2); padding: 10px 12px; display: none; }
.pop.on { display: block; }
.pop h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; padding-right: 20px; }
.pop .badges { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 10px; }
.pop .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.pop .x { position: absolute; right: 6px; top: 6px; border: 0; background: none; cursor: pointer; font-size: 18px; color: var(--muted); }
.rt { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 9px 3px 7px; background: var(--sunk); cursor: pointer; white-space: nowrap; }
.rt i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.rt.ok i { background: var(--ok); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); animation: pulse 2s infinite; }
.rt.ok { color: var(--ink); }
.rt.err i { background: var(--late); }
@keyframes pulse { 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .rt.ok i { animation: none; } }
.lv { font: 600 12px/1 var(--font-body); padding: 2px 5px; border-radius: 4px; white-space: nowrap; }
.lv.on { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.lv.late { color: var(--late); background: color-mix(in srgb, var(--late) 13%, transparent); }
.lv.early { color: var(--focus); background: color-mix(in srgb, var(--focus) 13%, transparent); }
s.sched { color: var(--muted); font-weight: 400; font-size: .72em; margin-left: 3px; }
table.tt td.live { color: var(--ok); }
table.tt td.live.late { color: var(--late); }
.dotlive, .dottheo { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dotlive { background: var(--ok); }
.dottheo { background: var(--theo); }
.wait { display: inline-flex; align-items: center; gap: 6px; }
.wait small { font: 500 11.5px/1 var(--font-body); color: var(--muted); }
.chip { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 64px; }
.chip .main { display: inline-flex; align-items: center; gap: 6px; }
.chip small { font: 500 11px/1 var(--font-body); color: var(--muted); }
.chip.soon small { color: inherit; opacity: .8; }
.chip.soon .dotlive, .chip.soon .dottheo { box-shadow: 0 0 0 2px var(--ink); }
.jc .next { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-size: 13.5px; }
.jc .next b { font: 700 15px/1 var(--font-display); }
.legend-dots { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend-dots span { display: inline-flex; align-items: center; gap: 5px; }
.mapctl button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pop .sub { font-size: 13.5px; color: var(--muted); }
.pop .sub b { color: var(--ink); font-weight: 600; }
canvas#map:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.empty { color: var(--muted); padding: 18px 4px; text-align: center; }
footer.src { padding: 10px 18px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--rule); }
footer.src a { color: inherit; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="top">
      <div class="mark" aria-hidden="true">GR</div>
      <h1>Horaires Grand Reims</h1>
      <div class="valid"><span id="valid"></span><button type="button" class="rt" id="rt" title="État du temps réel"><i></i><span>Temps réel…</span></button></div>
    </header>
    <nav class="tabs" aria-label="Sections">
      <a href="#itineraire" data-v="itineraire">Itinéraire</a>
      <a href="#passages" data-v="passages">Prochains passages</a>
      <a href="#lignes" data-v="lignes">Lignes</a>
    </nav>
    <div class="scroll">
      <!-- Itinéraire -->
      <section class="view" id="v-itineraire" aria-label="Itinéraire">
        <form id="f-it" class="od" autocomplete="off">
          <div class="stack">
            <div class="picker from"><span class="dot"></span><input class="inp" id="it-from" placeholder="Arrêt de départ" aria-label="Arrêt de départ"><div class="sugg" role="listbox"></div></div>
            <div class="picker to"><span class="dot"></span><input class="inp" id="it-to" placeholder="Arrêt d'arrivée" aria-label="Arrêt d'arrivée"><div class="sugg" role="listbox"></div></div>
          </div>
          <button type="button" class="swap" id="it-swap" title="Inverser départ et arrivée" aria-label="Inverser départ et arrivée">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2v12M5 14l-3-3M5 14l3-3M11 14V2M11 2l-3 3M11 2l3 3"/></svg>
          </button>
        </form>
        <div class="row">
          <div class="seg" role="group" aria-label="Type d'horaire">
            <button type="button" id="it-dep" aria-pressed="true">Partir à</button>
            <button type="button" id="it-arr" aria-pressed="false">Arriver avant</button>
          </div>
        </div>
        <div class="row">
          <div class="field"><label for="it-date">Date</label><input type="date" class="inp" id="it-date"></div>
          <div class="field"><label for="it-time">Heure</label><input type="time" class="inp" id="it-time" step="60"></div>
          <button type="button" class="btn" id="it-now">Maintenant</button>
        </div>
        <div id="it-msg"></div>
        <div class="results" id="it-res"></div>
      </section>

      <!-- Passages -->
      <section class="view" id="v-passages" aria-label="Prochains passages">
        <div class="picker from"><span class="dot"></span><input class="inp" id="pa-stop" placeholder="Choisir un arrêt" aria-label="Arrêt" autocomplete="off"><div class="sugg" role="listbox"></div></div>
        <div class="row">
          <div class="field"><label for="pa-date">Date</label><input type="date" class="inp" id="pa-date"></div>
          <div class="field"><label for="pa-time">À partir de</label><input type="time" class="inp" id="pa-time" step="60"></div>
          <button type="button" class="btn" id="pa-now">Maintenant</button>
        </div>
        <div id="pa-msg"></div>
        <div id="pa-res"></div>
      </section>

      <!-- Lignes -->
      <section class="view" id="v-lignes" aria-label="Lignes">
        <div id="li-grid" class="lgroup"></div>
        <div id="li-head"></div>
        <div class="row">
          <div class="field"><label for="li-date">Date</label><input type="date" class="inp" id="li-date"></div>
          <div class="field"><label for="li-time">À partir de</label><input type="time" class="inp" id="li-time" step="60"></div>
        </div>
        <div id="li-msg"></div>
        <div id="li-res"></div>
      </section>
    </div>
    <footer class="src" id="src"></footer>
  </aside>
  <section class="mapwrap" aria-label="Plan du réseau">
    <canvas id="map"></canvas>
    <div class="mapctl">
      <button type="button" id="z-in" aria-label="Zoomer">+</button>
      <button type="button" id="z-out" aria-label="Dézoomer">−</button>
      <button type="button" id="z-bus" aria-label="Bus en circulation" aria-pressed="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="2" width="12" height="11.5" rx="2.5"/><path d="M3 8.5h12M5.5 13.5V16M12.5 13.5V16"/><circle cx="6" cy="11" r=".9" fill="currentColor"/><circle cx="12" cy="11" r=".9" fill="currentColor"/></svg>
      </button>
      <button type="button" id="z-fit" aria-label="Recentrer" title="Recentrer">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg>
      </button>
    </div>
    <div class="maplegend" id="legend"><div class="legend-dots"><span><i class="dotlive"></i>bus suivi en temps réel</span><span><i class="dottheo"></i>position d'après l'horaire théorique</span></div></div>
    <div class="pop" id="pop"></div>
  </section>
</div>

// ---------- Prochains passages ----------

// ---------- Lignes ----------
setupDT($("#li-date"), $("#li-time"), null, () => runLi());

  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, s: view.s, m: fromS((a[0] + b[0]) / 2, (a[1] + b[1]) / 2) }; }
});
cv.addEventListener("pointermove", (e) => {
  const [px, py] = pos(e);
  if (!ptrs.has(e.pointerId)) {
    if (e.pointerType === "mouse") { const h = hitTest(px, py); const key = h ? h.kind + (h.i ?? h.v.pi + ":" + h.v.k) : ""; const old = hover ? hover.kind + (hover.i ?? hover.v.pi + ":" + hover.v.k) : ""; cv.style.cursor = h ? "pointer" : ""; if (key !== old) { hover = h; drawMap(); } }
    return;
  }
  const [ox, oy] = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [px, py]);
  if (ptrs.size === 1) {
    if (!moved && Math.hypot(px - downAt[0], py - downAt[1]) < 4) return;
    if (!moved) { moved = true; cv.classList.add("drag"); }
    view.cx -= (px - ox) / view.s; view.cy += (py - oy) / view.s; drawMap();
  } else if (ptrs.size === 2 && pinch0) {
    moved = true;
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    view.s = Math.max(ZMIN, Math.min(ZMAX, pinch0.s * d / pinch0.d));
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    view.cx = pinch0.m[0] - (mx - W / 2) / view.s; view.cy = pinch0.m[1] + (my - H / 2) / view.s; drawMap();
  }
});
const up = (e) => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null; if (ptrs.size === 1) { const [k] = ptrs.keys(); downAt = ptrs.get(k); } if (!ptrs.size) cv.classList.remove("drag"); };
cv.addEventListener("pointerup", (e) => { const wasMoved = moved; const single = ptrs.size === 1; up(e); if (!wasMoved && single) { const [px, py] = pos(e); clickMap(px, py); } });
cv.addEventListener("pointercancel", up);
cv.addEventListener("pointerleave", () => { if (hover) { hover = null; drawMap(); } });
cv.addEventListener("dblclick", (e) => { e.preventDefault(); const [px, py] = pos(e); zoomAt(px, py, 2, true); });
cv.addEventListener("wheel", (e) => {
  e.preventDefault(); cancelAnimationFrame(anim);
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
  const [px, py] = pos(e); zoomAt(px, py, Math.exp(-Math.max(-300, Math.min(300, dy)) * (e.ctrlKey ? 0.01 : 0.0022)));
}, { passive: false });
function zoomAt(sx, sy, f, smooth) {
  const [x, y] = fromS(sx, sy); const s = Math.max(ZMIN, Math.min(ZMAX, view.s * f));
  const cx = x - (sx - W / 2) / s, cy = y + (sy - H / 2) / s;
  if (smooth) animateTo(cx, cy, s); else { view.s = s; view.cx = cx; view.cy = cy; drawMap(); }
}
$("#z-in").addEventListener("click", () => zoomAt(W / 2, H / 2, 1.8, true));
$("#z-out").addEventListener("click", () => zoomAt(W / 2, H / 2, 1 / 1.8, true));
$("#z-fit").addEventListener("click", () => { hidePop(); if (S.view === "itineraire" && S.journeys[S.selJ]) fitJourney(S.journeys[S.selJ]); else if (S.view === "lignes" && S.line != null) fitLine(S.line); else if (S.view === "passages" && S.paStop != null) fitStop(S.paStop); else fitHome(); });
const busBtn = $("#z-bus");
const syncBusBtn = () => { busBtn.setAttribute("aria-pressed", showBuses); busBtn.title = showBuses ? "Masquer les bus en circulation" : "Afficher les bus en circulation"; };
busBtn.addEventListener("click", () => { showBuses = !showBuses; store.set("buses", showBuses); syncBusBtn(); drawMap(); });
syncBusBtn();
cv.tabIndex = 0;
cv.addEventListener("keydown", (e) => {
  const k = e.key, step = 80;
  if (k === "+" || k === "=") zoomAt(W / 2, H / 2, 1.5, true);
  else if (k === "-") zoomAt(W / 2, H / 2, 1 / 1.5, true);
  else if (k.startsWith("Arrow")) { view.cx += (k === "ArrowLeft" ? -step : k === "ArrowRight" ? step : 0) / view.s; view.cy += (k === "ArrowUp" ? step : k === "ArrowDown" ? -step : 0) / view.s; drawMap(); }
  else if (k === "Escape") hidePop();
  else return;
  e.preventDefault();
});

// ---------- info-bulle ancrée sur le plan ----------
const pop = $("#pop"); let popAt = null;
function hidePop() { pop.classList.remove("on"); popAt = null; }
function placePop() {
  if (!popAt) return;
  let sx, sy;
  if (popAt.veh) { const v = lastVeh.find((x) => x.pi === popAt.veh.pi && x.k === popAt.veh.k); if (!v) { hidePop(); return; } sx = v.sx; sy = v.sy; fillVehPop(v); }
  else [sx, sy] = toS(popAt.x, popAt.y);
  const pw = pop.offsetWidth || 240, ph = pop.offsetHeight || 140;
  let left = sx + 14, top = sy + 14;
  if (left + pw > W - 8) left = sx - pw - 14;
  if (top + ph > H - 8) top = sy - ph - 14;
  pop.style.left = Math.max(8, left) + "px"; pop.style.top = Math.max(8, top) + "px";
  pop.style.visibility = sx < -10 || sy < -10 || sx > W + 10 || sy > H + 10 ? "hidden" : "visible";
}
function fillVehPop(v) {
  const p = net.pats[v.pi], R = net.R[p.r];
  const nm = qName(p.stops[v.nextI]);
  const wait = v.next - nowMinF();
  const html = `<button type="button" class="x" aria-label="Fermer">×</button>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">${badge(p.r)}<h3 style="margin:0">→ ${esc(p.h)}</h3></div>
    <div class="sub">${v.atStop ? "À l'arrêt" : "Prochain arrêt"} : <b>${esc(nm)}</b>${v.atStop ? "" : ` · ${wait < 1 ? "imminent" : "dans " + Math.round(wait) + " min"}`}</div>
    <div class="sub" style="margin-top:6px;display:flex;gap:6px;align-items:center">${v.live ? `<span class="dotlive"></span>Position estimée d'après le temps réel${Math.abs(v.delay) >= 1 ? ` · ${v.delay > 0 ? "retard " + v.delay : "avance " + -v.delay} min` : " · à l'heure"}` : `<span class="dottheo"></span>Position estimée d'après l'horaire théorique`}</div>`;
  if (pop.dataset.html !== html) { pop.innerHTML = html; pop.dataset.html = html; }
}
pop.addEventListener("click", (e) => {
  if (e.target.closest(".x")) return hidePop();
  const a = e.target.closest("[data-a]")?.dataset.a; if (!a || popAt?.stop == null) return;
  const best = popAt.stop; hidePop();
  if (a === "pa") { S.paStop = best; paP.set(best); store.set("pa", pName(best)); if (location.hash !== "#passages") location.hash = "passages"; else { runPa(); fitStop(best); } return; }
  if (a === "from") { S.from = best; fromP.set(best); } else { S.to = best; toP.set(best); }
  if (location.hash !== "#itineraire") location.hash = "itineraire"; else runIt();
});
function clickMap(sx, sy) {
  const h = hitTest(sx, sy);
  if (!h) { hidePop(); return; }
  if (h.kind === "veh") { pop.dataset.html = ""; popAt = { veh: { pi: h.v.pi, k: h.v.k } }; fillVehPop(h.v); pop.classList.add("on"); placePop(); return; }
  const best = h.i, p = net.P[best];
  pop.dataset.html = "";
  pop.innerHTML = `<button type="button" class="x" aria-label="Fermer">×</button><h3>${esc(pName(best))}</h3><div class="badges">${net.pRoutes[best].map((r) => badge(r, 1)).join("")}</div>
    <div class="acts"><button type="button" class="btn small" data-a="from">Partir d'ici</button><button type="button" class="btn small" data-a="to">Y aller</button><button type="button" class="btn small" data-a="pa">Passages</button></div>`;
  popAt = { x: PX(p[2]), y: PY(p[1]), stop: best };
  pop.classList.add("on"); placePop();
}
// rafraîchit la position des bus (toutes les 2 s, seulement si la page est visible)
setInterval(() => { if (showBuses && !document.hidden && !ptrs.size) drawMap(); }, 2000);

// ---------- vues ----------
function route() {
  const v = (location.hash || "#itineraire").slice(1);
  S.view = ["itineraire", "passages", "lignes"].includes(v) ? v : "itineraire";
  document.querySelectorAll(".view").forEach((s) => s.classList.toggle("on", s.id === "v-" + S.view));
  document.querySelectorAll("nav.tabs a").forEach((a) => a.toggleAttribute("aria-current", false) || (a.dataset.v === S.view && a.setAttribute("aria-current", "page")));
  if (S.view === "itineraire") { runIt(); }
  else if (S.view === "passages") { runPa(); if (S.paStop != null) fitStop(S.paStop); }
  else { runLi(); if (S.line != null) fitLine(S.line); }
  drawMap();
}
window.addEventListener("hashchange", route);
new ResizeObserver(resize).observe(cv);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", drawMap);
new MutationObserver(drawMap).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

// état initial : derniers choix, sinon un exemple
const od = store.get("od") || ["Gare de Reims - Centre", "Hôpital Debré"];
S.from = findStop(od[0]); S.to = findStop(od[1]);
if (S.from < 0) S.from = findStop("Gare de Reims - Centre"); if (S.to < 0) S.to = findStop("Hôpital Debré");
fromP.set(S.from); toP.set(S.to);
const pa = store.get("pa") || "Opéra-Cathédrale"; S.paStop = findStop(pa); if (S.paStop < 0) S.paStop = findStop("Opéra-Cathédrale"); paP.set(S.paStop);
S.line = net.R.findIndex((r) => r.m === 1);
resize(); fitHome(); route();

// ---------- temps réel ----------
const RT_URL = "https://proxy.transport.data.gouv.fr/resource/fluo-citura-reims-gtfs-rt";
const rtEl = $("#rt"); const RT = { at: 0, ok: false, n: 0, err: "" };
function parisMidnightEpoch(k) {
  const iso = net.isoOf(k), noon = Date.parse(iso + "T12:00:00Z");
  const h = +new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Paris", hour: "2-digit", hourCycle: "h23" }).format(new Date(noon));
  return noon / 1000 - (h - 12) * 3600 - 12 * 3600;
}
function rtLabel() {
  if (RT.ok) { const s = Math.round((Date.now() - RT.at) / 1000); rtEl.className = "rt ok"; rtEl.lastChild.textContent = `Temps réel · ${RT.n} courses · ${s < 60 ? "à l'instant" : "il y a " + Math.round(s / 60) + " min"}`; }
  else if (RT.err) { rtEl.className = "rt err"; rtEl.lastChild.textContent = "Horaires prévus uniquement"; }
}
rtEl.addEventListener("click", () => { if (!RT.ok && RT.err) { rtEl.title = RT.err; } pollRT(); });
let rtTimer = 0;
async function pollRT() {
  clearTimeout(rtTimer);
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch(RT_URL, { cache: "no-store", signal: ctl.signal }); clearTimeout(to);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const feed = decodeFeed(new Uint8Array(await r.arrayBuffer()));
    const now = parisNow(); const today = net.dayIndex(now.iso);
    if (today < 0 || today >= net.nd) throw new Error("Le flux temps réel concerne une date hors du fichier d'horaires.");
    const st = applyRT(net, feed, today, parisMidnightEpoch);
    RT.ok = true; RT.at = Date.now(); RT.n = st.matched; RT.err = "";
    rtEl.title = `${st.matched} courses suivies en temps réel sur ${st.total} annoncées. Actualisation toutes les 30 s.`;
    rerender();
  } catch (e) {
    RT.ok = false;
    RT.err = !/claude/.test(location.hostname) ? "Flux temps réel injoignable pour le moment (" + (e.message || e) + "). Nouvel essai dans 30 s." : "Le temps réel ne peut pas être chargé dans cette page hébergée. Ouvrez la version locale (fichier .html) pour en profiter.";
    rtEl.title = RT.err;
    if (net.liveDay >= 0) { net.pats.forEach((p) => { p.LA = p.LD = p.live = null; }); net.liveDay = -1; rerender(); }
  }
  rtLabel();
  rtTimer = setTimeout(pollRT, 30000);
}
function rerender() {
  // garde le trajet choisi s'il existe encore
  const key = S.journeys[S.selJ]?.key;
  if (S.view === "itineraire") { const keepSel = S.selJ; runIt(true); const k = S.journeys.findIndex((j) => j.key === key); if (k >= 0 && k !== S.selJ) { S.selJ = k; document.querySelectorAll(".jc").forEach((c) => { const on = +c.dataset.k === k; c.classList.toggle("sel", on); $(".head", c).setAttribute("aria-expanded", on); }); drawMap(); } else if (keepSel < 0) { S.selJ = -1; document.querySelectorAll(".jc").forEach((c) => c.classList.remove("sel")); drawMap(); } }
  else if (S.view === "passages") runPa(); else runLi();
}
setInterval(rtLabel, 15000);
// compte à rebours : on rafraîchit l'affichage toutes les 30 s même sans temps réel
setInterval(() => { if (!document.hidden && !RT.ok) rerender(); }, 30000);
pollRT();
})();
</script>
