name: Mise à jour des horaires

# Télécharge le GTFS publié par Grand Reims Mobilités et reconstruit index.html si les horaires ont changé.
# Plusieurs fois par jour : en cas de perturbation, le réseau publie des courses modifiées pour la journée,
# et le temps réel ne parle que de ces nouvelles courses (sinon : plus de temps réel dans l'appli).
on:
  schedule:
    - cron: "17 3,9,15 * * *"   # tous les jours, 4h17, 10h17 et 16h17 (heure de Paris, hiver)
  workflow_dispatch:            # lancement manuel depuis l'onglet Actions
  push:
    branches: [main]
    paths:
      - .github/workflows/mise-a-jour-horaires.yml

permissions:
  contents: write

concurrency:
  group: mise-a-jour-horaires
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pandas
        run: pip install pandas==2.2.3

      - name: Télécharger le GTFS
        run: |
          curl -fsSL --retry 3 -o gtfs.zip "https://transport.data.gouv.fr/resources/80594/download"
          python -c "import zipfile; z = zipfile.ZipFile('gtfs.zip'); assert 'stop_times.txt' in z.namelist(), 'archive GTFS invalide'"

      - name: Reconstruire la page
        run: python build/make.py gtfs.zip

      - name: Publier si quelque chose a changé
        run: |
          rm -f gtfs.zip
          if git diff --quiet; then
            echo "Horaires inchangés."
            exit 0
          fi
          git config user.name "horaires-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html build/data.json
          git commit -m "Mise à jour automatique des horaires"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
