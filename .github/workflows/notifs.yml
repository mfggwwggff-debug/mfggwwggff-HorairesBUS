name: Service d'alertes

# Met en ligne le service d'alertes (#20) sur Cloudflare Workers : crée la base D1 au premier passage,
# applique le schéma, déploie, puis publie l'adresse du service dans notifs.json (lu par l'appli)
# et le journal de la mise en ligne dans notifs-deploy.log (secrets masqués).
# Secrets du dépôt nécessaires : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - notifs/**
      - .github/workflows/notifs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notifs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Mettre en ligne
        id: deploy
        working-directory: notifs
        run: |
          set +e
          LOG=../notifs-deploy.log
          : > $LOG
          say() { echo "$@" | tee -a $LOG; }
          run() { "$@" > out.txt 2>&1; c=$?; cat out.txt >> $LOG; cat out.txt; return $c; }
          say "== $(date -u +%FT%TZ) =="
          [ -n "$CLOUDFLARE_API_TOKEN" ] || say "ERREUR : secret CLOUDFLARE_API_TOKEN absent"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || say "ERREUR : secret CLOUDFLARE_ACCOUNT_ID absent"
          npm i -g wrangler@4 > /dev/null 2>&1 || say "ERREUR : installation de wrangler"
          say "-- base D1"
          getid() { wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const x=a.find(d=>d.name==="grm-notifs");process.stdout.write(x?(x.uuid||x.database_id||""):"")}catch(e){}})'; }
          ID=$(getid)
          if [ -z "$ID" ]; then run wrangler d1 create grm-notifs; ID=$(getid); fi
          say "base : ${ID:+trouvée}${ID:-INTROUVABLE}"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          say "-- schéma"
          run wrangler d1 execute grm-notifs --remote --file schema.sql
          say "-- déploiement"
          run wrangler deploy
          DC=$?
          URL=$(grep -o 'https://[A-Za-z0-9.-]*\.workers\.dev' out.txt | head -1)
          say "adresse : ${URL:-AUCUNE} (code $DC)"
          # masque les identifiants avant publication
          for v in "$CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_API_TOKEN" "$ID"; do [ -n "$v" ] && sed -i "s/$v/***/g" $LOG; done
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Publier l'adresse et le journal
        if: always()
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          git checkout -- notifs/wrangler.toml 2>/dev/null; rm -f notifs/out.txt
          if [ -n "$URL" ]; then
            printf '{"url":"%s","at":"%s"}\n' "$URL" "$(date -u +%FT%TZ)" > notifs.json
          fi
          git config user.name "notifs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notifs-deploy.log $( [ -n "$URL" ] && echo notifs.json )
          git diff --cached --quiet && exit 0
          git commit -m "Service d'alertes : mise en ligne"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
