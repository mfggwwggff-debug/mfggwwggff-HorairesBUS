name: Info trafic

# Relève l'info trafic de grandreims-mobilites.fr et publie info-trafic.json si les perturbations ont changé.
# Deux déclencheurs : la planification de GitHub (demandée toutes les 15 min, en pratique toutes les 35 à 60 min),
# et le service d'alertes (notifs/worker.js), qui lit le site toutes les 5 min et relance ce relevé dès qu'une
# info apparaît, change ou disparaît (secret GH_DISPATCH_TOKEN).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: info-trafic
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Relever l'info trafic
        run: python build/infotrafic.py > info-trafic.new.json

      - name: Déviations hors GTFS (#74)
        # arrêts non desservis, arrêts provisoires, tracé (OSRM) et temps estimés ; en cas d'échec on garde l'ancien fichier
        run: python build/deviations.py info-trafic.new.json > deviations.new.json || cp deviations.json deviations.new.json || echo {\"devs\":[]} > deviations.new.json

      - name: Publier si quelque chose a changé
        run: |
          # on compare sans l'horodatage
          strip() { python -c "import json,sys; d=json.load(open(sys.argv[1])); d.pop('at',None); print(json.dumps(d,sort_keys=True))" "$1" 2>/dev/null; }
          ch=0
          if [ -f info-trafic.json ] && [ "$(strip info-trafic.json)" = "$(strip info-trafic.new.json)" ]; then rm info-trafic.new.json; else mv info-trafic.new.json info-trafic.json; ch=1; fi
          if [ -f deviations.json ] && [ "$(strip deviations.json)" = "$(strip deviations.new.json)" ]; then rm deviations.new.json; else mv deviations.new.json deviations.json; ch=1; fi
          if [ "$ch" = 0 ]; then
            echo "Info trafic et déviations inchangées."
            exit 0
          fi
          git config user.name "info-trafic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add info-trafic.json deviations.json build/trafic-archive.json
          git commit -m "Info trafic : mise à jour"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
