name: Debug page info trafic
on:
  push:
    branches: [debug-page-it]
    paths: [".github/workflows/debug-page.yml", "debug-geo.py"]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Geo
        run: |
          python3 debug-geo.py
          git config user.name bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-geo.json; git commit -m "geo"; git push
