name: Feux (OSM)

# Relève les feux tricolores d'OpenStreetMap (build/feux.json), embarqués dans la page par build/make.py
# pour ralentir les bus du plan à leur approche (#39). Pris en compte à la prochaine mise à jour des horaires.
on:
  schedule:
    - cron: "47 3 4 * *"   # le 4 de chaque mois, 3h47 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build/feux.py
      - .github/workflows/feux.yml

permissions:
  contents: write

concurrency:
  group: feux
  cancel-in-progress: false

jobs:
  feux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Relever les feux
        run: python3 build/feux.py

      - name: Publier si quelque chose a changé
        run: |
          git add build/feux.json
          if git diff --cached --quiet; then
            echo "Feux inchangés."
            exit 0
          fi
          git config user.name "feux-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Feux (OSM) : mise à jour"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
