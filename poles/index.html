<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pôles en 3D · Grand Reims Mobilités</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--accent:#E8511C;--accent-strong:#C4430F;--ink:#1d1d1b;--muted:#6b6b6b;--surface:#fff;--line:#e7e3dc;--navy:#1C2B39}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:#ECE7DE}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}
.badge{pointer-events:auto;background:var(--surface);border-radius:14px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.12);display:flex;align-items:center;gap:10px}
.badge b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}.badge small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}.badge small{display:block;color:var(--muted);font-size:12px}
.dot{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.views{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
.vbtn{border:0;background:var(--surface);border-radius:12px;height:40px;padding:0 12px;font:500 13px "DM Sans",system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.12);cursor:pointer;color:var(--ink)}
.vbtn.on{background:var(--navy);color:#fff}
.vbtn svg{display:block}
#compass{cursor:pointer}
.recenter{position:fixed;left:50%;transform:translateX(-50%);display:none;border:0;background:var(--accent-strong);color:#fff;font:700 14px "DM Sans",system-ui,sans-serif;padding:10px 16px;border-radius:22px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:5}
#compass{position:fixed;right:14px;top:64px;width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.12);display:grid;place-items:center}
#compass svg{transition:none}
.panel{position:fixed;left:0;right:0;bottom:0;transform:translateZ(0);background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.14);padding:14px 16px calc(14px + env(safe-area-inset-bottom));max-height:52vh;overflow:hidden;display:flex;flex-direction:column}
.panel .scroll{overflow:auto;min-height:0;flex:1;-webkit-overflow-scrolling:touch}
@media (min-width:820px){.panel{left:16px;right:auto;bottom:16px;top:76px;width:360px;border-radius:20px;max-height:none}}
.grab{width:40px;height:4px;border-radius:2px;background:#d8d3cb;margin:0 auto 10px}
@media (min-width:820px){.grab{display:none}}
@media (max-width:819px){body.guiding .panel .f,body.guiding .panel select,body.guiding .panel ol,body.guiding .panel .note{display:none}}
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
select{width:100%;font:500 15px "DM Sans",system-ui,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#faf8f5;color:var(--ink);appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.sum{display:flex;align-items:center;gap:12px;margin:14px 0 10px}
.sum .big{font-size:26px;font-weight:700;color:var(--accent-strong)}
.sum .sub{font-size:13px;color:var(--muted)}
.go{margin-left:auto;border:0;background:var(--accent-strong);color:#fff;font:700 15px "DM Sans",system-ui,sans-serif;padding:12px 16px;border-radius:14px;cursor:pointer}
.go.stop{background:var(--navy)}
ol.steps{list-style:none;margin:6px 0 0;padding:0}
ol.steps li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;align-items:flex-start;transition:opacity .3s}
ol.steps li .n{width:22px;height:22px;border-radius:50%;background:#efebe5;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
ol.steps li .d{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap;padding-left:8px}
ol.steps li.cur .n{background:var(--accent);color:#fff}

.note{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.45}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:64px;background:rgba(28,43,57,.92);color:#fff;font-size:13px;padding:8px 12px;border-radius:12px;pointer-events:none;transition:opacity .5s;white-space:nowrap}
.banner{position:fixed;left:12px;right:12px;top:64px;background:var(--navy);color:#fff;border-radius:16px;padding:12px 14px;display:none;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
@media (min-width:820px){.banner{left:392px;right:auto;width:420px}}
.banner .ic{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.banner .t{font-weight:700;font-size:16px}.banner .s{font-size:12px;opacity:.8}
.file{display:block;margin-top:10px;font-size:13px;font-weight:500;color:var(--accent-strong);cursor:pointer}.file input{display:none}.err{color:#d0242b;font-size:12px;margin-top:6px}
.vbtn.back{width:40px;padding:0;display:grid;place-items:center;pointer-events:auto;flex:none}
.badge .bt{position:relative;min-width:0}
#poleSel{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.badge .bt b::after{content:" ▾";font-size:11px;color:var(--muted)}
.ldi{display:flex;flex-direction:column;align-items:center;gap:12px}.spin{width:34px;height:34px;border-radius:50%;border:3px solid #d8d1c6;border-top-color:var(--accent);animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
body.thumb .top,body.thumb .panel,body.thumb #compass,body.thumb .hint,body.thumb .banner{display:none!important}
.load{position:fixed;inset:0;display:grid;place-items:center;background:#ECE7DE;font-weight:500;color:var(--muted);transition:opacity .4s}

<body>
<canvas id="c"></canvas>
<div class="top">
  <button class="vbtn back" id="back" aria-label="Retour"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="badge"><div class="dot">3D</div><div class="bt"><b id="pName">Pôle</b><select id="poleSel" aria-label="Changer de pôle"></select></div></div>
  <div class="views"><button class="vbtn" id="vFit" title="Recentrer sur l'itinéraire"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg></button><button class="vbtn" id="v2d">2D</button></div>
</div>
<div id="compass" title="Nord"><svg width="26" height="26" viewBox="-13 -13 26 26"><g id="needle"><path d="M0-10 L4 0 L-4 0Z" fill="#E8511C"/><path d="M0 10 L4 0 L-4 0Z" fill="#c9c3ba"/><text x="0" y="-3.5" font-size="0" fill="#fff">N</text></g></svg></div>
<div class="banner" id="banner"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div><div><div class="t" id="bT"></div><div class="s" id="bS"></div></div></div>
<div class="hint" id="hint">1 doigt : déplacer · pincer : zoom · 2 doigts : tourner ou incliner</div>
<button class="recenter" id="recenter">Recentrer</button>
<div class="panel">
  <div class="grab"></div>
  <label class="f">Je descends</label>
  <select id="from"></select>
  <label class="f">Je prends</label>
  <select id="to"></select>
  <div class="sum"><div><div class="big" id="dist">–</div><div class="sub" id="time"></div></div><button class="go" id="go">Me guider</button></div>
  <div class="scroll"><ol class="steps" id="steps"></ol>
  <div class="note" id="note"></div><div class="err" id="err"></div></div>
</div>
<div class="load" id="load"><div class="ldi"><div class="spin"></div><span id="ldt">Chargement du pôle…</span></div></div>
<script type="module">
import * as THREE from "three";
import { MapControls } from "three/addons/controls/MapControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
const $ = (id) => document.getElementById(id);
const rad = (d) => ((d || 0) * Math.PI) / 180;
const canvas = $("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color("#E9E4DB"); scene.fog = new THREE.Fog("#E9E4DB", 500, 1100);
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 3000);
const controls = new MapControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.12; controls.maxPolarAngle = 1.2;
controls.minDistance = 15; controls.maxDistance = 520; controls.zoomToCursor = true; controls.zoomSpeed = 1.2; controls.rotateSpeed = 0.6;
controls.touches = { ONE: -1, TWO: -1 }; // gestes tactiles gérés plus bas (façon Plans / Google Maps)
scene.add(new THREE.HemisphereLight("#ffffff", "#c9bfae", 1.25));
const sun = new THREE.DirectionalLight("#fff6e8", 1.6);
sun.position.set(-160, 260, 120); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -300, right: 300, top: 300, bottom: -300, near: 10, far: 900 }); sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);
const mat = (c, o = {}) => new THREE.MeshLambertMaterial({ color: c, ...o });
const logoImgReady = null;
const FONT = '"DM Sans", system-ui, sans-serif';
let world = null, P = null, B = { x0: -200, x1: 200, z0: -200, z1: 200 }, LOGOS = {};

// ---------- libellés ----------
const SMALL = new Set(["de", "des", "du", "la", "le", "les", "et", "à", "d'", "l'"]);
function pretty(t) {
  if (!t) return "";
  t = t.replace("GARE CHAMP. TGV", "GARE CHAMPAGNE TGV").replace("FAC DES SCIENCES", "FACULTÉ DES SCIENCES").replace("HOPITAL", "HÔPITAL").replace("DEBRE", "DEBRÉ").replace("LEON BLUM", "LÉON BLUM").replace("ESPEREY", "ESPÈREY").replace("COMEDIE", "COMÉDIE").replace("OPERA", "OPÉRA").replace("CHAMPEA", "CHAMPÉA").replace("NEUFCHATEL", "NEUFCHÂTEL");
  if (t !== t.toUpperCase()) return t;
  return t.toLowerCase().split(" ").map((w, i) => {
    if (/^c\.c\.$/.test(w)) return "C.C.";
    if (w === "p+r" || w === "tgv" || w === "sncf") return w.toUpperCase();
    if (i && SMALL.has(w)) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(" ");
}
function withArticle(name) {
  if (!name) return null;
  let n = name.split(" · ")[0].trim(); const w = n.split(" ")[0].toLowerCase();
  const art = { boulevard: "le ", rue: "la ", cour: "la ", esplanade: "l'", avenue: "l'", allée: "l'", place: "la ", square: "le ", parvis: "le ", voies: "les ", quai: "le ", passage: "le ", promenade: "la ", chemin: "le " }[w];
  return art ? art + n.charAt(0).toLowerCase() + n.slice(1) : n;
}
const MODE = (r) => (r === "T1" || r === "T2" ? "tram" : r === "O1" || r === "O2" ? "BHNS" : "bus");

// ---------- logos ----------
const logoImg = {};
const loadImg = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });

// ---------- panneaux ----------
function signTexture(title, rows) {
  const Wd = 520, rh = 58, H = 64 + rows.length * rh + 14;
  const c = document.createElement("canvas"); c.width = Wd; c.height = H; const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.beginPath(); x.roundRect(0, 0, Wd, H, 14); x.fill();
  x.fillStyle = "#1C2B39"; x.beginPath(); x.roundRect(0, 0, Wd, 64, [14, 14, 0, 0]); x.fill();
  x.fillStyle = "#fff"; x.font = `700 34px ${FONT}`; x.textBaseline = "middle"; x.fillText(title, 18, 34, Wd - 36);
  rows.forEach(([l, h], i) => {
    const y = 64 + 7 + i * rh, img = logoImg[l]; let lw = 0;
    if (img) { lw = (44 * img.width) / img.height; x.drawImage(img, 18, y + 4, lw, 44); }
    else if (l) { x.fillStyle = l === "SNCF" ? "#E8511C" : "#1C2B39"; x.beginPath(); x.roundRect(18, y + 4, 64, 44, 9); x.fill(); x.fillStyle = "#fff"; x.font = `700 20px ${FONT}`; x.textAlign = "center"; x.fillText(l, 50, y + 27); x.textAlign = "left"; lw = 64; }
    x.fillStyle = "#1d1d1b"; x.font = `500 32px ${FONT}`; x.fillText(h, 18 + lw + 14, y + 27, Wd - lw - 50);
  });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return { t, ratio: H / Wd };
}
let pickables = [];
function addSign(x, z, lift, title, rows, data) {
  const { t, ratio } = signTexture(title, rows);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
  sp.scale.set(12, 12 * ratio, 1); sp.center.set(0.5, 0); sp.position.set(x, lift, z); sp.renderOrder = 10; sp.userData = { ...data, ratio };
  world.add(sp); pickables.push(sp);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, lift, 6), mat("#1C2B39")); pole.position.set(x, lift / 2, z); world.add(pole);
}

// ---------- décor exporté par Pôle Studio (.glb, compressé meshopt) ----------
function loadGLB(url) {
  return new Promise((ok, ko) => {
    const L = new GLTFLoader(); L.setMeshoptDecoder(MeshoptDecoder);
    L.load(url, (g) => {
      g.scene.traverse((m) => {
        if (!m.isMesh) return;
        const bb = (m.geometry.computeBoundingBox(), m.geometry.boundingBox), h = (bb.max.y - bb.min.y) * Math.abs(m.matrixWorld.elements[5] || m.scale.y || 1);
        m.receiveShadow = true; m.castShadow = h > 0.4;
        if (m.material && m.material.isMeshStandardMaterial) m.material.envMapIntensity = 0;
      });
      ok(g.scene);
    }, (e) => { if (e.total) $("ldt").textContent = `Chargement du pôle… ${Math.round((e.loaded / e.total) * 100)} %`; }, ko);
  });
}
// ---------- réseau piéton ----------
let NODES = {}, ADJ = {}, QUAIS = [], POIS = [];
function buildWalk(walk) {
  NODES = {}; ADJ = {};
  walk.nodes.forEach((n) => (NODES[n.id] = n));
  walk.edges.forEach((e) => {
    const a = NODES[e.from], b = NODES[e.to]; if (!a || !b) return;
    let d = Math.hypot(a.x - b.x, a.z - b.z); if (e.kind === "crosswalk" || e.kind === "track_crossing") d += 6;
    (ADJ[e.from] ||= []).push([e.to, d, e]); (ADJ[e.to] ||= []).push([e.from, d, e]);
  });
}
function route(a, b) {
  const dist = { [a]: 0 }, prev = {}, todo = new Set([a]);
  while (todo.size) {
    let u = null; for (const k of todo) if (u === null || dist[k] < dist[u]) u = k; todo.delete(u);
    if (u === b) break;
    for (const [v, d, e] of ADJ[u] || []) { const nd = dist[u] + d; if (dist[v] === undefined || nd < dist[v]) { dist[v] = nd; prev[v] = [u, e]; todo.add(v); } }
  }
  if (dist[b] === undefined) return null;
  const nodes = [b], edges = []; let k = b;
  while (k !== a) { const [p, e] = prev[k]; nodes.unshift(p); edges.unshift(e); k = p; }
  return { nodes, edges };
}

// ---------- construction d'un pôle ----------
const Q = new URLSearchParams(location.search), EMBED = Q.has("embed");
let POLES = [], PID = null;
async function build(id) {
  const meta = POLES.find((p) => p.id === id); if (!meta) throw new Error("Pôle introuvable.");
  PID = id; $("load").style.display = "grid"; $("load").style.opacity = 1; $("ldt").textContent = "Chargement du pôle…";
  const pole = await (await fetch(id + ".json", { cache: "no-cache" })).json();
  P = pole; if (world) { scene.remove(world); world.traverse((m) => { m.geometry?.dispose?.(); }); }
  world = new THREE.Group(); scene.add(world); pickables = [];
  $("pName").textContent = pole.name; document.title = pole.name + " en 3D";
  const [x0, z0, x1, z1] = pole.bounds || [-200, -200, 200, 200]; B = { x0, x1, z0, z1 };
  AZ0 = rad(meta.az ?? 0);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0 + 1200, z1 - z0 + 1200), mat("#E4DED2"));
  ground.rotation.x = -Math.PI / 2; ground.position.set((x0 + x1) / 2, -0.3, (z0 + z1) / 2); ground.receiveShadow = true; world.add(ground);
  if (meta.glb) { try { world.add(await loadGLB(meta.glb)); } catch (e) { console.warn(e); $("err").textContent = "Le décor 3D n'a pas pu être chargé."; } }
  QUAIS = pole.quais; POIS = pole.pois || [];
  const need = new Set(); QUAIS.forEach((q) => { q.assignments.forEach((a) => need.add(a.routeId)); (q.routes || []).forEach((r) => need.add(r)); });
  await Promise.all([...need].filter((r) => LOGOS[r] && !logoImg[r]).map(async (r) => (logoImg[r] = await loadImg(LOGOS[r][0]))));
  const placed = [], lift0 = 7;
  const title = pole.name;
  QUAIS.forEach((q) => {
    let rows = q.assignments.filter((a) => !q.arrivalOnly).map((a) => [a.routeId, pretty(a.direction)]);
    const seenR = new Set(); rows = rows.filter((r) => { const k = r.join("|"); if (seenR.has(k)) return false; seenR.add(k); return true; });
    if (!rows.length) rows = routesAt(q).map((r) => [r, "Descente seulement"]);
    let lift = lift0; while (placed.some((p) => Math.hypot(p.x - q.x, p.z - q.z) < 22 && Math.abs(p.lift - lift) < 6)) lift += 6;
    placed.push({ x: q.x, z: q.z, lift }); addSign(q.x, q.z, lift, title, rows, { stop: q.stopId });
  });
  POIS.forEach((p) => addSign(p.x, p.z, 16, p.label, p.kind === "station_entrance" ? [["SNCF", "TER · TGV"]] : [], { poi: p.id }));
  buildWalk(pole.walk); fillSelects();
  $("note").textContent = (pole.attribution ? pole.attribution + " " : "") + "Décor réalisé avec Pôle Studio.";
  const ld = $("load"); ld.style.opacity = 0; setTimeout(() => (ld.style.display = "none"), 400);
}
function routesAt(q) { return q.routes?.length ? q.routes : [...new Set(q.assignments.map((a) => a.routeId))]; }

// ---------- choix ----------
const fromSel = $("from"), toSel = $("to");
function quaiLabel(q) {
  if (q.arrivalOnly || !q.assignments.length) return `${routesAt(q).join(", ")} · descente`;
  const by = {}; q.assignments.forEach((a) => { const h = pretty(a.direction); (by[h] ||= []).includes(a.routeId) || by[h].push(a.routeId); });
  return Object.entries(by).map(([h, ls]) => `${ls.join(", ")} → ${h}`).join(" · ");
}
const rank = (r) => (r[0] === "T" ? 0 : r[0] === "O" ? 1 : r[0] === "U" || r === "C" ? 2 : 3);
function fillSelects() {
  fromSel.innerHTML = ""; toSel.innerHTML = "";
  const ok = QUAIS.filter((q) => q.walkNode && NODES[q.walkNode]);
  [...ok].sort((a, b) => rank(routesAt(a)[0] || "Z") - rank(routesAt(b)[0] || "Z") || routesAt(a)[0]?.localeCompare(routesAt(b)[0] || "", "fr", { numeric: true }))
    .forEach((q) => fromSel.add(new Option(quaiLabel(q), q.stopId)));
  const dests = [], seen = new Set();
  ok.forEach((q) => { if (q.arrivalOnly) return; q.assignments.forEach((a) => { const h = pretty(a.direction), k = q.stopId + a.routeId + h; if (seen.has(k) || h === pretty(P.name)) return; seen.add(k); dests.push({ q, a, h }); }); });
  dests.sort((x, y) => rank(x.a.routeId) - rank(y.a.routeId) || x.a.routeId.localeCompare(y.a.routeId, "fr", { numeric: true }) || x.h.localeCompare(y.h))
    .forEach(({ q, a, h }) => toSel.add(new Option(`${a.routeId} → ${h}`, `S|${q.stopId}|${a.routeId}|${h}`)));
  POIS.forEach((p) => toSel.add(new Option(p.label, `P|${p.id}`)));
  // présélection : ?from=<stop_id>&to=<stop_id> (pour le guidage plus tard), sinon un tram puis une correspondance
  const qf = Q.get("from"), qt = Q.get("to");
  const f = (qf && [...fromSel.options].find((o) => o.value === qf)) || [...fromSel.options].find((o) => /^T1/.test(o.text)) || fromSel.options[0];
  if (f) fromSel.value = f.value;
  const t = (qt && [...toSel.options].find((o) => o.value.startsWith("S|" + qt + "|"))) || [...toSel.options].find((o) => !o.value.startsWith("S|" + fromSel.value + "|") && !/^T/.test(o.text)) || toSel.options[0];
